<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Lookup Tool - ZIP & IP Address Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-100px) translateX(50px); }
            50% { transform: translateY(-200px) translateX(-50px); }
            75% { transform: translateY(-100px) translateX(100px); }
        }

        .container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
            animation: slideIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            z-index: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-in;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 30px 40px 20px;
            background: #f8f9fa;
        }

        .mode-btn {
            flex: 1;
            padding: 18px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            background: white;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .search-section {
            padding: 30px 40px 40px;
            background: #f8f9fa;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        input[type="text"] {
            flex: 1;
            padding: 18px 25px;
            font-size: 1.15em;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            padding: 18px 45px;
            font-size: 1.15em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .results {
            display: none;
            padding: 40px;
            animation: fadeInUp 0.6s ease-out;
            background: linear-gradient(to bottom, #ffffff 0%, #f8f9fa 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 4px solid #667eea;
        }

        .results h2 {
            color: #333;
            font-size: 2.2em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.5em;
            font-weight: normal;
            animation: bounceIn 0.8s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .detail-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            animation: cardSlideIn 0.6s ease-out backwards;
        }

        .detail-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, #667eea, #764ba2);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .detail-card:hover::before {
            transform: scaleY(1);
        }

        .detail-card:nth-child(1) { animation-delay: 0.1s; }
        .detail-card:nth-child(2) { animation-delay: 0.15s; }
        .detail-card:nth-child(3) { animation-delay: 0.2s; }
        .detail-card:nth-child(4) { animation-delay: 0.25s; }
        .detail-card:nth-child(5) { animation-delay: 0.3s; }
        .detail-card:nth-child(6) { animation-delay: 0.35s; }
        .detail-card:nth-child(7) { animation-delay: 0.4s; }
        .detail-card:nth-child(8) { animation-delay: 0.45s; }
        .detail-card:nth-child(9) { animation-delay: 0.5s; }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateX(-30px) rotateY(-10deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
        }

        .detail-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .detail-label {
            font-size: 0.85em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-value {
            font-size: 1.4em;
            color: #222;
            font-weight: 700;
            margin-bottom: 15px;
            word-break: break-word;
            line-height: 1.4;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copied {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%) !important;
            animation: success 0.5s ease;
        }

        @keyframes success {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .error {
            display: none;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 40px;
            animation: shake 0.6s ease-in-out;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            50% { transform: translateX(15px); }
            75% { transform: translateX(-15px); }
        }

        .map-section {
            margin-top: 35px;
            padding: 30px;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 15px;
            border: 2px solid #2196F3;
            animation: fadeInUp 0.6s ease-out 0.5s backwards;
        }

        .map-section h3 {
            margin-bottom: 20px;
            color: #1565C0;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .map-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 1.05em;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .map-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }

        .info-box {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 5px solid #2196F3;
            animation: slideInLeft 0.6s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .info-box p {
            color: #1565C0;
            margin: 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .mode-selector {
                flex-direction: column;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        .icon {
            display: inline-block;
            font-style: normal;
        }

        /* Tooltip for copy button */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            margin-bottom: 5px;
        }

        .tooltip:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation" id="bgAnimation"></div>

    <div class="container">
        <div class="header">
            <h1>🌍 Advanced Lookup Tool</h1>
            <p>Professional Address & Location Finder - ZIP Code & IP Based</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('zip')" id="zipModeBtn">
                <span class="icon">📮</span> ZIP Code Lookup
            </button>
            <button class="mode-btn" onclick="switchMode('ip')" id="ipModeBtn">
                <span class="icon">🌐</span> IP Address Lookup
            </button>
        </div>

        <div class="search-section">
            <div class="info-box" id="infoBox">
                <p><span class="icon">📍</span> Enter a US ZIP code to generate contact details for that location</p>
            </div>
            <div class="input-wrapper">
                <div class="input-group">
                    <input type="text" id="searchInput" placeholder="Enter ZIP Code (e.g., 33147)" maxlength="10">
                    <button class="btn btn-primary" onclick="generateDetails()">
                        <span class="icon">🔍</span> Generate
                    </button>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Fetching data from servers...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="results-header">
                <h2>
                    <span class="icon">📋</span> Contact Details
                    <span class="badge" id="modeBadge">ZIP Based</span>
                </h2>
            </div>
            <div class="detail-grid" id="detailGrid"></div>
            <div class="map-section">
                <h3><span class="icon">🗺️</span> Map Search</h3>
                <a href="#" id="mapLink" class="map-link" target="_blank">
                    <span class="icon">📍</span> Open Location in Google Maps
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'zip';

        // Sample data for random generation
        const firstNames = ['Richard', 'John', 'Michael', 'David', 'James', 'Robert', 'William', 'Joseph', 'Thomas', 'Charles', 'Christopher', 'Daniel', 'Matthew', 'Anthony', 'Donald', 'Mary', 'Patricia', 'Jennifer', 'Linda', 'Elizabeth', 'Barbara', 'Susan', 'Jessica', 'Sarah', 'Karen'];
        
        const lastNames = ['Taylor', 'Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis', 'Rodriguez', 'Martinez', 'Hernandez', 'Lopez', 'Wilson', 'Anderson', 'Thomas', 'Moore', 'Jackson', 'Martin', 'Lee', 'Thompson', 'White', 'Harris', 'Clark', 'Lewis'];
        
        const streets = ['Main St', 'Oak Ave', 'Pine Dr', 'Maple Ln', 'Cedar Rd', 'Elm St', 'Birch Dr', 'Willow Way', 'Park Ave', 'Lake Dr', 'Hill St', 'Valley Rd', 'River Ln', 'Forest Ave', 'Sunset Blvd', 'Ocean Dr', 'Mountain View', 'Broadway', 'Washington St', 'Lincoln Ave'];

        const emailDomains = ['gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'icloud.com', 'aol.com'];

        // US State abbreviations to full name mapping
        const stateNames = {
            'AL': 'Alabama', 'AK': 'Alaska', 'AZ': 'Arizona', 'AR': 'Arkansas', 'CA': 'California',
            'CO': 'Colorado', 'CT': 'Connecticut', 'DE': 'Delaware', 'FL': 'Florida', 'GA': 'Georgia',
            'HI': 'Hawaii', 'ID': 'Idaho', 'IL': 'Illinois', 'IN': 'Indiana', 'IA': 'Iowa',
            'KS': 'Kansas', 'KY': 'Kentucky', 'LA': 'Louisiana', 'ME': 'Maine', 'MD': 'Maryland',
            'MA': 'Massachusetts', 'MI': 'Michigan', 'MN': 'Minnesota', 'MS': 'Mississippi', 'MO': 'Missouri',
            'MT': 'Montana', 'NE': 'Nebraska', 'NV': 'Nevada', 'NH': 'New Hampshire', 'NJ': 'New Jersey',
            'NM': 'New Mexico', 'NY': 'New York', 'NC': 'North Carolina', 'ND': 'North Dakota', 'OH': 'Ohio',
            'OK': 'Oklahoma', 'OR': 'Oregon', 'PA': 'Pennsylvania', 'RI': 'Rhode Island', 'SC': 'South Carolina',
            'SD': 'South Dakota', 'TN': 'Tennessee', 'TX': 'Texas', 'UT': 'Utah', 'VT': 'Vermont',
            'VA': 'Virginia', 'WA': 'Washington', 'WV': 'West Virginia', 'WI': 'Wisconsin', 'WY': 'Wyoming',
            'DC': 'District of Columbia'
        };

        // Create animated background particles
        function createParticles() {
            const bgAnimation = document.getElementById('bgAnimation');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 80 + 20 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                bgAnimation.appendChild(particle);
            }
        }

        createParticles();

        function switchMode(mode) {
            currentMode = mode;
            const zipBtn = document.getElementById('zipModeBtn');
            const ipBtn = document.getElementById('ipModeBtn');
            const searchInput = document.getElementById('searchInput');
            const infoBox = document.getElementById('infoBox');

            if (mode === 'zip') {
                zipBtn.classList.add('active');
                ipBtn.classList.remove('active');
                searchInput.placeholder = 'Enter ZIP Code (e.g., 33147)';
                searchInput.maxLength = 5;
                infoBox.innerHTML = '<p><span class="icon">📍</span> Enter a US ZIP code to generate contact details for that location</p>';
            } else {
                ipBtn.classList.add('active');
                zipBtn.classList.remove('active');
                searchInput.placeholder = 'Enter IP Address (e.g., 8.8.8.8)';
                searchInput.maxLength = 15;
                infoBox.innerHTML = '<p><span class="icon">🌐</span> Enter an IP address to find location details and generate contact information</p>';
            }

            searchInput.value = '';
            hideResults();
            hideError();
        }

        async function generateDetails() {
            const searchInput = document.getElementById('searchInput');
            const inputValue = searchInput.value.trim();

            if (!inputValue) {
                showError(`Please enter a valid ${currentMode === 'zip' ? 'ZIP code' : 'IP address'}`);
                return;
            }

            if (currentMode === 'zip') {
                if (inputValue.length !== 5 || !/^\d+$/.test(inputValue)) {
                    showError('Please enter a valid 5-digit ZIP code');
                    return;
                }
                await fetchZipData(inputValue);
            } else {
                if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(inputValue)) {
                    showError('Please enter a valid IP address (e.g., 8.8.8.8)');
                    return;
                }
                await fetchIpData(inputValue);
            }
        }

        async function fetchZipData(zipCode) {
            showLoading(true);
            hideError();
            hideResults();

            try {
                const response = await fetch(`https://api.zippopotam.us/us/${zipCode}`);
                
                if (!response.ok) {
                    throw new Error('ZIP code not found');
                }

                const data = await response.json();
                const place = data.places[0];
                
                const contactDetails = generateContactData({
                    city: place['place name'],
                    state: place['state abbreviation'],
                    stateFull: place['state'],
                    zipCode: zipCode,
                    country: 'US'
                });

                displayResults(contactDetails, 'ZIP Based');
                
            } catch (error) {
                showError('Unable to find information for this ZIP code. Please try another one.');
            } finally {
                showLoading(false);
            }
        }

        async function fetchIpData(ipAddress) {
            showLoading(true);
            hideError();
            hideResults();

            try {
                const response = await fetch(`https://ipapi.co/${ipAddress}/json/`);
                
                if (!response.ok) {
                    throw new Error('IP address lookup failed');
                }

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.reason || 'Invalid IP address');
                }

                // Only proceed if it's a US IP
                if (data.country_code !== 'US') {
                    showError('This tool currently supports US locations only. Please enter a US-based IP address.');
                    showLoading(false);
                    return;
                }

                const contactDetails = generateContactData({
                    city: data.city,
                    state: data.region_code,
                    stateFull: data.region,
                    zipCode: data.postal || generateRandomZip(),
                    country: data.country_code
                });

                displayResults(contactDetails, 'IP Based');
                
            } catch (error) {
                showError('Unable to fetch IP data. Please check the IP address and try again.');
            } finally {
                showLoading(false);
            }
        }

        function generateContactData(locationData) {
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            const phone = generatePhone();
            const street = `${Math.floor(Math.random() * 9000) + 1000} ${streets[Math.floor(Math.random() * streets.length)]}`;
            
            // Generate email
            const emailPrefix = (firstName + '.' + lastName).toLowerCase();
            const emailDomain = emailDomains[Math.floor(Math.random() * emailDomains.length)];
            const email = `${emailPrefix}@${emailDomain}`;
            
            // Get full state name
            const stateFullName = stateNames[locationData.state] || locationData.stateFull;
            const stateDisplay = `${locationData.state} (${stateFullName})`;
            
            return {
                'First Name': firstName,
                'Last Name': lastName,
                'Email': email,
                'Phone': phone,
                'Street': street,
                'City': locationData.city,
                'State': stateDisplay,
                'ZIP': locationData.zipCode,
                'Country': locationData.country,
                'Map Search': `${stateFullName}, ${locationData.city}, ${locationData.zipCode}, homes`
            };
        }

        function generatePhone() {
            const areaCode = Math.floor(Math.random() * 800) + 200;
            const firstPart = Math.floor(Math.random() * 900) + 100;
            const secondPart = Math.floor(Math.random() * 9000) + 1000;
            return `${areaCode}${firstPart}${secondPart}`;
        }

        function generateRandomZip() {
            return String(Math.floor(Math.random() * 90000) + 10000);
        }

        function displayResults(details, mode) {
            const detailGrid = document.getElementById('detailGrid');
            const mapLink = document.getElementById('mapLink');
            const modeBadge = document.getElementById('modeBadge');
            
            modeBadge.textContent = mode;
            detailGrid.innerHTML = '';

            const icons = {
                'First Name': '👤',
                'Last Name': '👥',
                'Email': '📧',
                'Phone': '📱',
                'Street': '🏠',
                'City': '🌆',
                'State': '📍',
                'ZIP': '📮',
                'Country': '🌎'
            };
            
            for (const [label, value] of Object.entries(details)) {
                if (label !== 'Map Search') {
                    const card = document.createElement('div');
                    card.className = 'detail-card';
                    const icon = icons[label] || '📄';
                    const elementId = label.replace(/\s/g, '');
                    
                    card.innerHTML = `
                        <div class="detail-label">
                            <span class="icon">${icon}</span> ${label}
                        </div>
                        <div class="detail-value" id="${elementId}">${value}</div>
                        <button class="copy-btn tooltip" data-tooltip="Click to copy" onclick="copyToClipboard('${elementId}', this)">
                            <span class="icon">📋</span> Copy
                        </button>
                    `;
                    detailGrid.appendChild(card);
                }
            }

            const mapSearchString = details['Map Search'];
            mapLink.href = `https://www.google.com/maps/search/${encodeURIComponent(mapSearchString)}`;
            
            // Add Export All button after grid
            const existingExport = document.getElementById('exportSection');
            if (existingExport) existingExport.remove();
            
            const exportSection = document.createElement('div');
            exportSection.id = 'exportSection';
            exportSection.style.cssText = 'margin-top: 30px; text-align: center; padding: 25px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 15px; border: 2px dashed #667eea;';
            exportSection.innerHTML = `
                <h3 style="margin-bottom: 15px; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <span class="icon">📦</span> Export Options
                </h3>
                <button class="btn btn-primary" onclick="exportAllData()" style="padding: 15px 35px; font-size: 1em;">
                    <span class="icon">📄</span> Copy All Details
                </button>
            `;
            
            const resultsDiv = document.getElementById('results');
            const mapSection = resultsDiv.querySelector('.map-section');
            resultsDiv.insertBefore(exportSection, mapSection);
            
            document.getElementById('results').style.display = 'block';
        }

        function copyToClipboard(elementId, button) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<span class="icon">✓</span> Copied!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
                alert('Failed to copy. Please try again.');
            });
        }

        function exportAllData() {
            let allText = 'Contact Details\n';
            allText += '='.repeat(50) + '\n\n';
            
            const fields = ['FirstName', 'LastName', 'Email', 'Phone', 'Street', 'City', 'State', 'ZIP', 'Country'];
            
            fields.forEach(field => {
                const element = document.getElementById(field);
                if (element) {
                    const label = field.replace(/([A-Z])/g, ' $1').trim();
                    allText += `${label}: ${element.textContent}\n`;
                }
            });
            
            allText += '\n' + '='.repeat(50);
            
            navigator.clipboard.writeText(allText).then(() => {
                const exportBtn = event.target;
                const originalHTML = exportBtn.innerHTML;
                exportBtn.innerHTML = '<span class="icon">✓</span> All Data Copied!';
                exportBtn.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
                
                setTimeout(() => {
                    exportBtn.innerHTML = originalHTML;
                    exportBtn.style.background = '';
                }, 3000);
            }).catch(err => {
                console.error('Export failed:', err);
                alert('Failed to export data. Please try again.');
            });
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function hideResults() {
            document.getElementById('results').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // Allow Enter key to trigger search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateDetails();
            }
        });
    </script>
</body>
</html>
